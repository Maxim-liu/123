<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>银行每日线报</title><style id="report-style">
:root{--ink:#24364a;--muted:#63788e;--blue:#205ea6;--navy:#163e72;--line:#dce5ef;--soft:#f3f7fc;--danger:#b54839}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding:22px 18px;background:#f5f7fb;color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1240px;margin:auto;min-width:0}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}header.top{padding:25px 28px;background:linear-gradient(120deg,#132c50,#205ea6);border-radius:16px;color:white}header.top h1{font-size:26px;line-height:1.4;margin:0 0 7px}header.top .sub{margin:0;color:#dbe8fa;font-size:13px}.notice-strong{margin:12px 0 0;font-size:12px;color:#e6effb}.region-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;position:sticky;top:0;z-index:10;padding:9px 0;margin:10px 0;background:#f5f7fbf2;backdrop-filter:blur(12px)}.region-tab{cursor:pointer;border:1px solid #cbd8e6;background:white;color:#38536e;border-radius:11px;padding:12px 8px;font-size:16px;font-weight:700}.region-tab small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}.region-tab.active{background:var(--navy);border-color:var(--navy);color:white}.region-tab.active small{color:#d9e8ff}.region-panel[hidden],[hidden]{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:4px 0 16px}.stat{background:#fff;border:1px solid var(--line);padding:14px 16px;border-radius:11px}.stat .n{font-size:26px;line-height:1.2;font-weight:750;color:var(--blue)}.stat .l{font-size:12px;color:var(--muted);margin-top:6px}.quick-nav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 17px}.quick-nav a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:white;font-size:12px;font-weight:600}.card,.spotlight{border:1px solid var(--line);border-radius:13px;background:#fff;margin:0 0 16px;padding:19px;box-shadow:0 3px 14px #193e5a06;min-width:0;scroll-margin-top:105px}.card h2,.spotlight h2{font-size:17px;line-height:1.5;margin:0 0 13px;color:#183f70;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:#e9f1fc;color:var(--blue);font-weight:500}.section-note,.region-note{font-size:12px;color:var(--muted);margin:7px 0 12px}.empty{padding:13px 14px;background:#f7f9fc;color:var(--muted);border:1px dashed #d9e3ef;border-radius:8px;font-size:13px}.spotlight.rare{border-left:4px solid #8a6fc1}.spotlight.value{border-left:4px solid #d2a354}.spotlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.spot{background:#f7faff;border:1px solid #e0e9f3;border-radius:9px;padding:13px;min-width:0}.spot h3{font-size:14px;margin:6px 0}.spot .bank-label{font-size:11px;color:var(--muted)}.reward{font-weight:750;color:var(--blue);font-size:16px;line-height:1.45}.spot p{font-size:12px;margin:8px 0;color:#52677d}.spot a{font-size:12px}.table-scroll{width:100%;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}caption{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}th{background:#edf3fb;text-align:left;color:#365674;font-size:12px;font-weight:650}th,td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}tbody tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#fafcfe}tbody tr:hover{background:#f2f7fd}.bank{font-weight:650;color:#244b79}.offer-title{font-weight:650;display:block}.offer-detail{font-size:12px;color:#52677d;margin:5px 0 0}.offer-reward{font-weight:650;color:#235b95;margin-bottom:5px}.offer-extra{font-size:11px;color:var(--muted);margin-top:5px}.date-cell{font-size:12px}.time-cell{color:#235b95;font-weight:650;white-space:normal}.source-link{display:inline-block;font-size:12px;white-space:nowrap}.region-tools{display:grid;grid-template-columns:minmax(180px,2fr) minmax(130px,1fr) minmax(130px,1fr);gap:9px;margin:0 0 8px}.region-tools input,.region-tools select{width:100%;min-width:0;padding:9px 10px;border:1px solid #cbd8e6;border-radius:7px;background:white;color:var(--ink)}.filter-meta{font-size:12px;color:var(--muted);margin:0 0 10px}.footer{text-align:center;padding:12px;color:var(--muted);font-size:12px}.app-update-banner{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:#153e70;color:white;padding:11px 14px;border-radius:12px;box-shadow:0 8px 28px #173a5c40;z-index:100;display:none;align-items:center;gap:14px;font-size:13px}.app-update-banner.show{display:flex}.app-update-banner button{background:white;color:#174879;border:0;border-radius:6px;padding:6px 10px;font-weight:650;white-space:nowrap}.comparison-note{display:block;margin-top:5px;color:var(--muted);font-size:12px}
@media(max-width:900px){.spotlight-grid{grid-template-columns:repeat(2,minmax(0,1fr))}th,td{padding:9px 8px}.card,.spotlight{padding:15px}}
@media(max-width:640px){body{padding:9px;font-size:13px}header.top{padding:18px 16px;border-radius:12px}header.top h1{font-size:20px}.region-tabs{gap:5px;margin:6px 0}.region-tab{font-size:13px;padding:10px 3px}.region-tab small{font-size:10px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:12px}.stat{padding:11px}.stat .n{font-size:23px}.stat .l{font-size:11px}.quick-nav{gap:5px;margin-bottom:12px}.quick-nav a{padding:5px 9px;font-size:11px}.card,.spotlight{padding:12px;border-radius:11px;margin-bottom:12px;scroll-margin-top:90px}.card h2,.spotlight h2{font-size:15px}.spotlight-grid{grid-template-columns:1fr}.region-tools{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.region-tools input{grid-column:1/-1}.table-scroll{overflow:visible;border:0;border-radius:0}table,tbody{display:block;width:100%;min-width:0!important}thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}tbody tr{display:block;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:9px;background:white!important}tbody tr:last-child{margin-bottom:0}td{display:grid;grid-template-columns:70px minmax(0,1fr);gap:7px;padding:5px 0;border:0;font-size:12px}td::before{content:attr(data-label);color:var(--muted);font-size:11px;font-weight:500}td>div{min-width:0}td.bank{font-size:13px}.offer-detail{font-size:12px}.offer-extra{font-size:11px}.source-link{white-space:normal}.footer{font-size:11px}}
@media print{body{background:white;padding:0}.region-tabs,.region-tools,.filter-meta,.quick-nav,.app-update-banner{display:none!important}.card,.spotlight,.stat{box-shadow:none}.card{break-inside:avoid}.region-panel[hidden]{display:none!important}}
</style><link href="./manifest.webmanifest" rel="manifest"><link href="./icons/icon-192.png" rel="apple-touch-icon"><meta name="theme-color" content="#132c50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="银行线报"><meta name="description" content="中港美银行信用卡、里程、稀缺活动及高价值活动每日线报"></head><body><main class="wrap"><header class="top"><h1>银行每日线报</h1><p class="sub"></p></header><div class="region-tabs" role="tablist" aria-label="地区专区"><button type="button" role="tab" id="tab-cn" aria-controls="region-cn" aria-selected="true" class="region-tab active" data-region="cn">🇨🇳 中国大陆<small></small></button><button type="button" role="tab" id="tab-hk" aria-controls="region-hk" aria-selected="false" tabindex="-1" class="region-tab" data-region="hk">🇭🇰 中国香港<small></small></button><button type="button" role="tab" id="tab-us" aria-controls="region-us" aria-selected="false" tabindex="-1" class="region-tab" data-region="us">🇺🇸 美国<small></small></button></div><div id="region-cn" class="region-panel" role="tabpanel" aria-labelledby="tab-cn"></div><div id="region-hk" class="region-panel" role="tabpanel" aria-labelledby="tab-hk" hidden></div><div id="region-us" class="region-panel" role="tabpanel" aria-labelledby="tab-us" hidden></div><footer class="footer"></footer></main><script id="report-ui-script">(()=>{const tabs=[...document.querySelectorAll('.region-tab')];function show(region){if(!['cn','hk','us'].includes(region))return;tabs.forEach(button=>{const active=button.dataset.region===region;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active));button.tabIndex=active?0:-1});document.querySelectorAll('.region-panel').forEach(panel=>panel.hidden=panel.id!=='region-'+region)}tabs.forEach((button,index)=>{button.addEventListener('click',()=>show(button.dataset.region));button.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;show(tabs[next].dataset.region);tabs[next].focus()})});document.querySelectorAll('[data-offer-filter]').forEach(root=>{const rows=[...root.querySelectorAll('tbody tr')],search=root.querySelector('input[type=search]'),bank=root.querySelector('[data-filter=bank]'),category=root.querySelector('[data-filter=category]'),result=root.querySelector('.filter-meta'),empty=root.querySelector('.filter-empty');function filter(){let count=0;const term=search.value.trim().toLocaleLowerCase();rows.forEach(row=>{const match=(!bank.value||row.dataset.bank===bank.value)&&(!category.value||row.dataset.category===category.value)&&(!term||row.textContent.toLocaleLowerCase().includes(term));row.hidden=!match;if(match)count++});result.textContent='显示 '+count+' / '+rows.length+' 项';if(empty)empty.hidden=count!==0}search.addEventListener('input',filter);bank.addEventListener('change',filter);category.addEventListener('change',filter);filter()});})();</script><div class="app-update-banner" id="app-update-banner" role="status">发现新版日报<button id="app-update-button" type="button">立即更新</button></div><script id="pwa-app-script">
(()=>{
const BUILD='__REPORT_DATE__';
const REV='__REPORT_REVISION__';
const banner=document.getElementById('app-update-banner');
const button=document.getElementById('app-update-button');
if(!banner||!button)return;
banner.setAttribute('aria-live','polite');
let checking=false;
let refreshing=false;
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
}
function hasUpdate(data){
  if(!data||typeof data!=='object')return false;
  const revision=typeof data.revision==='string'?data.revision.trim():'';
  if(revision)return revision!==REV;
  const date=typeof data.report_date==='string'?data.report_date:data.date;
  // Older deployments only contain a date; correcting a future date is also an update.
  return typeof date==='string'&&/^20\d{2}-\d{2}-\d{2}$/.test(date)&&date!==BUILD;
}
async function check(){
  if(checking||refreshing||!/^https?:$/.test(location.protocol))return;
  checking=true;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),10000);
  try{
    const response=await fetch('./latest.json?check='+Date.now(),{cache:'no-store',signal:controller.signal});
    if(!response.ok)return;
    const data=await response.json();
    banner.style.display=hasUpdate(data)?'flex':'none';
  }catch(_){}finally{
    clearTimeout(timeout);
    checking=false;
  }
}
button.addEventListener('click',()=>{
  if(refreshing)return;
  refreshing=true;
  button.disabled=true;
  button.textContent='更新中…';
  const target=new URL('./',location.href);
  target.searchParams.set('v',String(Date.now()));
  target.hash=location.hash;
  // Only the user's click navigates; service-worker activation never reloads a page.
  location.replace(target.href);
});
check();
setInterval(()=>{if(!document.hidden)check()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
window.addEventListener('pageshow',()=>{if(!document.hidden)check()});
window.addEventListener('online',()=>{if(!document.hidden)check()});
})();</script></body></html>
