:root{--blue:#3b82c4;--blue-d:#2a639c;--blue-l:#eaf3fb;--blue-l2:#f5f9fd;--line:#d8e4f0;--ink:#22384e;--ink-2:#5a7186;--warn:#c2610b;--danger:#c0392b;--ok:#2e8b57;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#f0f5fa;color:var(--ink);font-size:13px;line-height:1.6;padding:24px 16px;}
.wrap{max-width:1100px;margin:0 auto;}
header.top{background:linear-gradient(135deg,#2a639c,#3b82c4);color:#fff;border-radius:12px;padding:22px 26px;box-shadow:0 2px 10px rgba(42,99,156,.25);}
header.top h1{font-size:22px;font-weight:600;letter-spacing:.5px;}
header.top .sub{margin-top:6px;font-size:12px;opacity:.9;}
header.top .chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:2px 12px;font-size:11.5px;}
.chip.today{background:#ffd76e;color:#7a5200;border-color:#ffc94d;font-weight:600;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0;}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(34,56,78,.05);}
.stat .n{font-size:24px;font-weight:700;color:var(--blue-d);}
.stat .n.hot{color:var(--danger);}
.stat .l{font-size:12px;color:var(--ink-2);margin-top:2px;}
section.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(34,56,78,.05);}
section.card>h2{font-size:15px;color:var(--blue-d);padding-bottom:10px;border-bottom:2px solid var(--blue-l);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
h2 svg{flex:none;}
h2 .tag{margin-left:auto;font-size:11px;font-weight:400;color:var(--ink-2);}
table{width:100%;border-collapse:collapse;background:#fff;}
th{background:var(--blue-l);color:var(--blue-d);font-weight:600;font-size:12px;padding:7px 8px;border:1px solid var(--line);text-align:left;white-space:nowrap;}
td{padding:6px 8px;border:1px solid var(--line);vertical-align:top;font-size:12.5px;}
tr:nth-child(even) td{background:var(--blue-l2);}
td.bank{font-weight:600;color:var(--blue-d);white-space:nowrap;}
td.bank.hasrow{border-top:2px solid #b9d2ea;}
.badge{display:inline-block;border-radius:3px;padding:0 6px;font-size:11px;line-height:18px;white-space:nowrap;}
.b-wed{background:#ffe9d6;color:var(--warn);border:1px solid #f3c48f;}
.b-mile{background:#e3f2ec;color:#1d6b45;border:1px solid #b5ddc6;}
.b-cash{background:#fdeaea;color:var(--danger);border:1px solid #efb9b9;}
.b-exp{background:#f0e6fb;color:#6b3fa0;border:1px solid #d5c3ee;}
.dead{color:var(--danger);font-weight:600;}
.warn{color:var(--warn);font-weight:600;}
.pts{color:#1d6b45;}
ul.plain{list-style:none;}
ul.plain li{padding:5px 0 5px 18px;position:relative;border-bottom:1px dashed var(--line);}
ul.plain li:last-child{border-bottom:none;}
ul.plain li::before{content:"";position:absolute;left:4px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--blue);}
a{color:var(--blue-d);text-decoration:none;}
a:hover{text-decoration:underline;}
.note{font-size:11.5px;color:var(--ink-2);margin-top:10px;line-height:1.7;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}.grid2{grid-template-columns:1fr;}}
.footer{color:var(--ink-2);font-size:11px;text-align:center;padding:10px 0 4px;}

<h1>银行 &amp; 里程活动日报 · 全球三区</h1>
<div class="sub"></div>

</header><div aria-label="地区专区" class="region-tabs" role="tablist"><button aria-controls="region-cn" aria-selected="true" class="region-tab active" data-region="cn" id="tab-cn" role="tab" type="button">🇨🇳 中国大陆<small></small></button><button aria-controls="region-hk" aria-selected="false" class="region-tab" data-region="hk" id="tab-hk" role="tab" tabindex="-1" type="button">🇭🇰 中国香港<small></small></button><button aria-controls="region-us" aria-selected="false" class="region-tab" data-region="us" id="tab-us" role="tab" tabindex="-1" type="button">🇺🇸 美国<small></small></button></div><nav aria-label="快速导航" class="quick-nav"><a data-section="today" href="#today">今日必抢</a><a data-section="all" href="#all">全部活动</a><a data-section="miles" href="#miles">里程积分</a><a data-section="deadlines" href="#deadlines">截止日历</a></nav><div aria-labelledby="tab-cn" class="region-panel" id="region-cn" role="tabpanel"></div><div aria-labelledby="tab-hk" class="region-panel" hidden="" id="region-hk" role="tabpanel"></div><div aria-labelledby="tab-us" class="region-panel" hidden="" id="region-us" role="tabpanel"></div><footer class="footer"></footer></main><script id="report-ui-script">(()=>{
const tabs=[...document.querySelectorAll('.region-tab')];
function show(region){
  if(!['cn','hk','us'].includes(region))return;
  tabs.forEach(button=>{const active=button.dataset.region===region;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active));button.tabIndex=active?0:-1});
  document.querySelectorAll('.region-panel').forEach(panel=>panel.hidden=panel.id!=='region-'+region);
  document.querySelectorAll('nav.quick-nav [data-section]').forEach(link=>{link.href='#'+(region==='cn'?'':region+'-')+link.dataset.section;link.hidden=region==='cn'&&link.dataset.section==='deadlines';const labels=region==='cn'?{today:'提醒',all:'日常活动',miles:'特别活动'}:{today:'今日必看',all:'全部活动',miles:'里程积分',deadlines:'截止日历'};link.textContent=labels[link.dataset.section]||''});
}
function top(){window.scrollTo({top:0,left:0,behavior:'instant'})}
function selectRegion(region){
  show(region);
  const hash='#region-'+region;
  if(location.hash!==hash)history.pushState(null,'',hash);
  top();
}
function syncFromHash(){
  let id;
  try{id=decodeURIComponent(location.hash.slice(1))}catch(_){return}
  if(!id){show('cn');top();return}
  const target=document.getElementById(id);
  if(!target)return;
  const panel=target.matches('.region-panel')?target:target.closest('.region-panel');
  const region=panel?panel.id.slice('region-'.length):target.dataset.region;
  if(!region)return;
  show(region);
  if(target.hidden){
    const filterRoot=target.closest('[data-offer-filter]');
    if(filterRoot){filterRoot.querySelectorAll('input[type=search],select').forEach(control=>control.value='');filterRoot.querySelector('input[type=search]').dispatchEvent(new Event('input',{bubbles:true}));}
  }
  if(target===panel||target.matches('.region-tab'))top();
  else requestAnimationFrame(()=>target.scrollIntoView({block:'start',behavior:'instant'}));
}
tabs.forEach((button,index)=>{
  button.addEventListener('click',()=>selectRegion(button.dataset.region));
  button.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    event.preventDefault();
    const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    selectRegion(tabs[next].dataset.region);
    tabs[next].focus({preventScroll:true});
  });
});
document.querySelectorAll('[data-offer-filter]').forEach(root=>{
  const rows=[...root.querySelectorAll('tbody tr')],search=root.querySelector('input[type=search]'),bank=root.querySelector('[data-filter=bank]'),category=root.querySelector('[data-filter=category]'),deadline=root.querySelector('[data-filter=deadline]'),reset=root.querySelector('[data-filter-reset]'),result=root.querySelector('.filter-count')||root.querySelector('.filter-meta'),empty=root.querySelector('.filter-empty');
  function filter(){
    let count=0;const term=search.value.trim().toLocaleLowerCase(),day=root.dataset.reportDate||'',month=day.slice(0,7),future=new Date(day+'T00:00:00Z');future.setUTCDate(future.getUTCDate()+7);const soon=Number.isNaN(future.getTime())?'':future.toISOString().slice(0,10);
    rows.forEach(row=>{const end=row.dataset.deadline||'',dateMatch=!deadline||!deadline.value||(deadline.value==='dated'&&!!end)||(deadline.value==='month'&&end.startsWith(month))||(deadline.value==='soon'&&!!end&&end>=day&&end<=soon);const match=(!bank.value||row.dataset.bank===bank.value)&&(!category.value||row.dataset.category===category.value)&&(!term||row.textContent.toLocaleLowerCase().includes(term))&&dateMatch;row.hidden=!match;if(match)count++});
    result.textContent='显示 '+count+' / '+rows.length+' 条';if(empty)empty.hidden=count!==0;
  }
  search.addEventListener('input',filter);bank.addEventListener('change',filter);category.addEventListener('change',filter);if(deadline)deadline.addEventListener('change',filter);if(reset)reset.addEventListener('click',()=>{search.value='';bank.value='';category.value='';if(deadline)deadline.value='';filter()});filter();
});
document.querySelectorAll('a[href^="#offer-"]').forEach(link=>link.addEventListener('click',event=>{
  if(link.hash===location.hash&&!event.metaKey&&!event.ctrlKey&&!event.shiftKey&&!event.altKey){event.preventDefault();syncFromHash();}
}));
window.addEventListener('hashchange',syncFromHash);
window.addEventListener('popstate',syncFromHash);
syncFromHash();
})();</script><div class="app-update-banner" id="app-update-banner" role="status">发现新版日报<button id="app-update-button" type="button">立即更新</button></div><script id="pwa-app-script">
(()=>{
const BUILD='__REPORT_DATE__';
const REV='__REPORT_REVISION__';
const banner=document.getElementById('app-update-banner');
const button=document.getElementById('app-update-button');
if(!banner||!button)return;
banner.setAttribute('aria-live','polite');
let checking=false;
let refreshing=false;
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
}
function hasUpdate(data){
  if(!data||typeof data!=='object')return false;
  const revision=typeof data.revision==='string'?data.revision.trim():'';
  if(revision)return revision!==REV;
  const date=typeof data.report_date==='string'?data.report_date:data.date;
  // Older deployments only contain a date; correcting a future date is also an update.
  return typeof date==='string'&&/^20\d{2}-\d{2}-\d{2}$/.test(date)&&date!==BUILD;
}
async function check(){
  if(checking||refreshing||!/^https?:$/.test(location.protocol))return;
  checking=true;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),10000);
  try{
    const response=await fetch('./latest.json?check='+Date.now(),{cache:'no-store',signal:controller.signal});
    if(!response.ok)return;
    const data=await response.json();
    banner.style.display=hasUpdate(data)?'flex':'none';
  }catch(_){}finally{
    clearTimeout(timeout);
    checking=false;
  }
}
button.addEventListener('click',()=>{
  if(refreshing)return;
  refreshing=true;
  button.disabled=true;
  button.textContent='更新中…';
  const target=new URL('./',location.href);
  target.searchParams.set('v',String(Date.now()));
  target.hash=location.hash;
  // Only the user's click navigates; service-worker activation never reloads a page.
  location.replace(target.href);
});
check();
setInterval(()=>{if(!document.hidden)check()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
window.addEventListener('pageshow',()=>{if(!document.hidden)check()});
window.addEventListener('online',()=>{if(!document.hidden)check()});
})();</script></body></html>
