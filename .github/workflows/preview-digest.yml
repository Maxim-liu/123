name: Build digest preview
on:
  push:
    branches: [feat/wechat-reminders-special]
    paths-ignore: ['index.html', 'latest.json']
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - name: Generate isolated preview
        run: |
          python bank_daily_setup/generate_report.py --date "$(python -c 'import json; print(json.load(open("latest.json"))["date"])')" --no-publish --output-dir /tmp/preview
          cp /tmp/preview/*.html index.html
          python -c 'from bs4 import BeautifulSoup; s=BeautifulSoup(open("index.html"),"html.parser"); assert [x.h2.get_text() for x in s.select("#region-cn > section")]==["提醒","日常活动","特别活动"]'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Build isolated digest preview' && git push)
